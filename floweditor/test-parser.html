<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Parser</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test API Response Parser</h1>
    
    <div class="test-section">
        <h2>Parser Test</h2>
        <button onclick="testParser()">Test Parser Logic</button>
        <div id="results"></div>
    </div>

    <script>
        // Simulate the exact parser logic from WeniGPTRouterForm.tsx
        function testParser() {
            const resultsDiv = document.getElementById('results');
            
            // Test data that matches our API responses
            const testData = {
                knowledgeBases: {
                    "statusCode": 200,
                    "body": "{\"results\":[{\"id\":1,\"name\":\"General Knowledge\",\"description\":\"General knowledge base for common queries\",\"created_at\":\"2025-11-22T19:43:13.553Z\",\"updated_at\":\"2025-11-22T19:43:13.553Z\"},{\"id\":2,\"name\":\"Product Information\",\"description\":\"Product-specific knowledge base\",\"created_at\":\"2025-11-22T19:43:13.553Z\",\"updated_at\":\"2025-11-22T19:43:13.553Z\"}],\"count\":2,\"next\":null,\"previous\":null}"
                },
                captainAssistants: {
                    "statusCode": 200,
                    "body": "{\"results\":[{\"id\":\"captain-1\",\"name\":\"Captain Assistant 1\",\"intelligence\":\"Captain\",\"created_at\":\"2025-11-22T19:44:22.630Z\",\"updated_at\":\"2025-11-22T19:44:22.630Z\"},{\"id\":\"captain-2\",\"name\":\"Captain Assistant 2\",\"intelligence\":\"Captain\",\"created_at\":\"2025-11-22T19:44:22.630Z\",\"updated_at\":\"2025-11-22T19:44:22.630Z\"},{\"id\":\"captain-3\",\"name\":\"Captain Assistant 3\",\"intelligence\":\"Captain\",\"created_at\":\"2025-11-22T19:44:22.630Z\",\"updated_at\":\"2025-11-22T19:44:22.630Z\"}],\"count\":3,\"next\":null,\"previous\":null}"
                }
            };

            try {
                console.log('🔍 Test: Starting parser test...');
                
                // Test the parseApiResponse function
                const parseApiResponse = (data) => {
                    if (!data) return null;
                    
                    // Check if it's the wrapper format with statusCode and body
                    if (data.statusCode === 200 && data.body) {
                        try {
                            const bodyData = typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
                            console.log('🔍 Test: Parsed wrapper format:', bodyData);
                            return bodyData;
                        } catch (e) {
                            console.error('🔍 Test: Failed to parse body:', e);
                            return data;
                        }
                    }
                    
                    return data;
                };

                // Test parsing
                const parsedKB = parseApiResponse(testData.knowledgeBases);
                const parsedCaptain = parseApiResponse(testData.captainAssistants);
                
                console.log('🔍 Test: Parsed knowledge bases:', parsedKB);
                console.log('🔍 Test: Parsed captain assistants:', parsedCaptain);

                // Test extraction
                const extract = (data) => {
                    if (Array.isArray(data)) return data;
                    if (data && typeof data === 'object' && 'results' in data && Array.isArray(data.results)) return data.results;
                    if (data && typeof data === 'object' && 'data' in data && Array.isArray(data.data)) return data.data;
                    return [];
                };

                const kbResults = extract(parsedKB);
                const captainResults = extract(parsedCaptain);
                
                console.log('🔍 Test: Extracted KB results:', kbResults);
                console.log('🔍 Test: Extracted Captain results:', captainResults);

                // Test mapping
                const wenigptKBs = kbResults.map((item) => ({
                    id: String(item.id ?? item.uuid ?? ''),
                    name: item.name ?? item.label ?? String(item.id ?? ''),
                    content: { intelligence: item.intelligence ?? item?.content?.intelligence ?? 'KB' },
                }));
                
                const captainKBs = captainResults.map((item) => ({
                    id: String(item.id ?? item.uuid ?? ''),
                    name: item.name ?? item.label ?? String(item.id ?? ''),
                    content: { intelligence: 'Captain' },
                }));

                console.log('🔍 Test: Mapped WeniGPT KBs:', wenigptKBs);
                console.log('🔍 Test: Mapped Captain KBs:', captainKBs);

                // Test final merging and labeling
                let merged = [...wenigptKBs, ...captainKBs].map((kb) => ({
                    ...kb,
                    label: `${kb.content?.intelligence} - ${kb.name}`,
                }));
                
                console.log('🔍 Test: Final merged data:', merged);

                // Display results
                let html = '<div class="success">';
                html += '<h3>✅ Parser Test Results</h3>';
                html += `<p><strong>Knowledge Bases:</strong> ${wenigptKBs.length} items</p>`;
                html += '<ul>';
                wenigptKBs.forEach(kb => {
                    html += `<li>${kb.label}</li>`;
                });
                html += '</ul>';
                
                html += `<p><strong>Captain Assistants:</strong> ${captainKBs.length} items</p>`;
                html += '<ul>';
                captainKBs.forEach(kb => {
                    html += `<li>${kb.label}</li>`;
                });
                html += '</ul>';
                
                html += `<p><strong>Total Items:</strong> ${merged.length}</p>`;
                html += '</div>';
                
                resultsDiv.innerHTML = html;
                
                console.log('🔍 Test: Parser test completed successfully!');
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Parser Test Failed</h3>
                        <p>Error: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
                console.error('🔍 Test: Parser test failed:', error);
            }
        }

        // Run test on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Test: Parser test page loaded');
            console.log('🔍 Test: Click "Test Parser Logic" to verify API parsing works correctly');
        });
    </script>
</body>
</html>
