<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { margin: 5px; padding: 10px 15px; font-size: 14px; cursor: pointer; }
        .loading { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <h1>Direct API Test for WeniGPT</h1>
    
    <div class="test-section info">
        <h2>Test Live API Data</h2>
        <p>This page directly tests the API endpoints to verify live data is available.</p>
        <button onclick="testAPIs()">Test API Endpoints</button>
        <button onclick="testParser()">Test Parser Logic</button>
        <div id="results"></div>
    </div>

    <script>
        async function testAPIs() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Testing APIs...</div>';
            
            try {
                console.log('🔍 Test: Starting API tests...');
                
                // Test knowledge bases
                console.log('🔍 Test: Fetching knowledge bases...');
                const kbResponse = await fetch('/floweditor-api/api/v1/accounts/1/flow_editor/knowledge_bases');
                console.log('🔍 Test: KB response status:', kbResponse.status);
                
                let kbData = null;
                let kbError = null;
                if (kbResponse.ok) {
                    kbData = await kbResponse.json();
                    console.log('🔍 Test: KB data:', kbData);
                } else {
                    kbError = `HTTP ${kbResponse.status}`;
                }
                
                // Test captain assistants
                console.log('🔍 Test: Fetching captain assistants...');
                const captainResponse = await fetch('/floweditor-api/api/v1/accounts/1/captain/assistants');
                console.log('🔍 Test: Captain response status:', captainResponse.status);
                
                let captainData = null;
                let captainError = null;
                if (captainResponse.ok) {
                    captainData = await captainResponse.json();
                    console.log('🔍 Test: Captain data:', captainData);
                } else {
                    captainError = `HTTP ${captainResponse.status}`;
                }
                
                // Display results
                let html = '<div class="success">';
                
                if (kbResponse.ok) {
                    html += `<h3>✅ Knowledge Bases API</h3>`;
                    html += `<p>Status: ${kbResponse.status}</p>`;
                    if (kbData) {
                        try {
                            const bodyData = typeof kbData.body === 'string' ? JSON.parse(kbData.body) : kbData;
                            const results = bodyData.results || bodyData.data || bodyData;
                            html += `<p>Found ${Array.isArray(results) ? results.length : 0} items</p>`;
                            if (Array.isArray(results) && results.length > 0) {
                                html += '<ul>';
                                results.forEach(item => {
                                    html += `<li>${item.name || item.label || 'Unnamed'}</li>`;
                                });
                                html += '</ul>';
                            }
                        } catch (e) {
                            html += `<p>Raw data: ${JSON.stringify(kbData).substring(0, 100)}...</p>`;
                        }
                    }
                } else {
                    html += `<h3>❌ Knowledge Bases API</h3>`;
                    html += `<p>Error: ${kbError}</p>`;
                }
                
                html += '<hr>';
                
                if (captainResponse.ok) {
                    html += `<h3>✅ Captain Assistants API</h3>`;
                    html += `<p>Status: ${captainResponse.status}</p>`;
                    if (captainData) {
                        try {
                            const bodyData = typeof captainData.body === 'string' ? JSON.parse(captainData.body) : captainData;
                            const results = bodyData.results || bodyData.data || bodyData;
                            html += `<p>Found ${Array.isArray(results) ? results.length : 0} items</p>`;
                            if (Array.isArray(results) && results.length > 0) {
                                html += '<ul>';
                                results.forEach(item => {
                                    html += `<li>${item.name || item.label || 'Unnamed'}</li>`;
                                });
                                html += '</ul>';
                            }
                        } catch (e) {
                            html += `<p>Raw data: ${JSON.stringify(captainData).substring(0, 100)}...</p>`;
                        }
                    }
                } else {
                    html += `<h3>❌ Captain Assistants API</h3>`;
                    html += `<p>Error: ${captainError}</p>`;
                }
                
                html += '</div>';
                resultsDiv.innerHTML = html;
                
                // Test if data matches expected dropdown format
                const totalItems = (kbData ? (() => {
                    try {
                        const bodyData = typeof kbData.body === 'string' ? JSON.parse(kbData.body) : kbData;
                        return (bodyData.results || bodyData.data || bodyData).length;
                    } catch (e) { return 0; }
                })() : 0) + (captainData ? (() => {
                    try {
                        const bodyData = typeof captainData.body === 'string' ? JSON.parse(captainData.body) : captainData;
                        return (bodyData.results || bodyData.data || bodyData).length;
                    } catch (e) { return 0; }
                })() : 0);
                
                if (totalItems > 0) {
                    resultsDiv.innerHTML += `
                        <div class="info" style="margin-top: 10px;">
                            <h4>🎯 Expected Dropdown Content</h4>
                            <p>The WeniGPT dropdown should show <strong>${totalItems} live items</strong> from the API:</p>
                            <ul>
                                <li>"General Knowledge" (from KB API)</li>
                                <li>"Product Information" (from KB API)</li>
                                <li>"Captain Assistant 1" (from Captain API)</li>
                                <li>"Captain Assistant 2" (from Captain API)</li>
                                <li>"Captain Assistant 3" (from Captain API)</li>
                            </ul>
                            <p><strong>NOT</strong> the static fallback data like "Intelligence 1 - Base 1", etc.</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ API Test Failed</h3>
                        <p>Error: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
                console.error('🔍 Test: API test failed:', error);
            }
        }

        function testParser() {
            const resultsDiv = document.getElementById('results');
            
            // Test the exact parser logic from WeniGPTRouterForm.tsx
            const parseApiResponse = (data) => {
                if (!data) return null;
                
                // Check if it's the wrapper format with statusCode and body
                if (data.statusCode === 200 && data.body) {
                    try {
                        const bodyData = typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
                        console.log('🔍 Test: Parsed wrapper format:', bodyData);
                        return bodyData;
                    } catch (e) {
                        console.error('🔍 Test: Failed to parse body:', e);
                        return data;
                    }
                }
                
                return data;
            };

            const extract = (data) => {
                if (Array.isArray(data)) return data;
                if (data && typeof data === 'object' && 'results' in data && Array.isArray(data.results)) return data.results;
                if (data && typeof data === 'object' && 'data' in data && Array.isArray(data.data)) return data.data;
                return [];
            };

            // Test with actual API response format
            const testData = {
                "statusCode": 200,
                "body": "{\"results\":[{\"id\":1,\"name\":\"General Knowledge\",\"description\":\"General knowledge base for common queries\",\"created_at\":\"2025-11-22T19:48:40.220Z\",\"updated_at\":\"2025-11-22T19:48:40.220Z\"},{\"id\":2,\"name\":\"Product Information\",\"description\":\"Product-specific knowledge base\",\"created_at\":\"2025-11-22T19:48:40.220Z\",\"updated_at\":\"2025-11-22T19:48:40.220Z\"}],\"count\":2,\"next\":null,\"previous\":null}"
            };

            try {
                const parsed = parseApiResponse(testData);
                const extracted = extract(parsed);
                
                const mapped = extracted.map((item) => ({
                    id: String(item.id ?? item.uuid ?? ''),
                    name: item.name ?? item.label ?? String(item.id ?? ''),
                    content: { intelligence: item.intelligence ?? item?.content?.intelligence ?? 'KB' },
                }));

                const final = mapped.map((kb) => ({
                    ...kb,
                    label: `${kb.content?.intelligence} - ${kb.name}`,
                }));

                let html = '<div class="success">';
                html += '<h3>✅ Parser Logic Test</h3>';
                html += `<p>Input: Wrapper format with statusCode 200</p>`;
                html += `<p>Parsed: ${extracted.length} items</p>`;
                html += `<p>Mapped: ${mapped.length} items</p>`;
                html += '<h4>Final Dropdown Items:</h4><ul>';
                final.forEach(item => {
                    html += `<li>${item.label}</li>`;
                });
                html += '</ul></div>';
                
                resultsDiv.innerHTML = html;
                
                console.log('🔍 Test: Parser test completed successfully');
                console.log('🔍 Test: Final dropdown items:', final);
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Parser Test Failed</h3>
                        <p>Error: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
                console.error('🔍 Test: Parser test failed:', error);
            }
        }

        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Test: Direct API test page loaded');
            console.log('🔍 Test: Click "Test API Endpoints" to verify live data');
            console.log('🔍 Test: Click "Test Parser Logic" to verify parsing works');
        });
    </script>
</body>
</html>
